appId: com.radheya.securevault
productName: SecureVault
directories:
  output: release
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: securevault
  # certificateFile: ./cert.pfx
  certificatePassword: ${env.WIN_CERT_PASSWORD}
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: SecureVault requests camera access to capture and encrypt documents.
    - NSMicrophoneUsageDescription: SecureVault requests microphone access for future voice-note attachments.
    - NSDocumentsFolderUsageDescription: SecureVault requests access to the Documents folder to import files into the vault.
    - NSDownloadsFolderUsageDescription: SecureVault requests access to the Downloads folder to import files into the vault.
  hardenedRuntime: true
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: yourcompany
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: yourgithubuser
  repo: securevault